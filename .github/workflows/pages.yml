name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/bubble-bobble-online-game-h24kog
  workflow_dispatch:

# Least privilege needed to publish a Pages site.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Requires Pages to be switched on once by a repo admin:
      # Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
      # The workflow token cannot create the Pages site itself.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The game is plain static files, so the repo root ships as-is.
      # This action already excludes .git and .github.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
